name: Publish Civilization DApp container

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_WORLD_APP_ID=${{ vars.WORLD_APP_ID }}
            VITE_WORLD_ID_ACTION=play
            VITE_CIVILIZATION_CONTRACT_ADDRESS=0x29147c7bead901e8019d7911a7dc404447877c62
            VITE_WORLD_ID_PROOF_CONTEXT_URL=https://civilization.nyphon.de/api/world-id/proof-context
            VITE_WORLD_ID_ENVIRONMENT=production
          tags: |
            ghcr.io/ralphschuler/civilization.dapp:latest
            ghcr.io/ralphschuler/civilization.dapp:${{ github.sha }}
