name: Verify and publish Civilization DApp container

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: civilization_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d civilization_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/civilization_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record deterministic offline contract-assurance manifest
        env:
          SECURITY_ASSURANCE_REF: ${{ github.sha }}
        run: pnpm security:offline
      - name: Install pinned Slither and Solidity compiler
        run: |
          solc_path="$RUNNER_TEMP/solc-linux-amd64-v0.8.30+commit.73712a01"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$solc_path" \
            https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.30+commit.73712a01
          echo "f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7  $solc_path" | sha256sum --check --strict
          chmod 0755 "$solc_path"
          python3 -m pip install --user --disable-pip-version-check 'slither-analyzer==0.11.3'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run pinned Slither analysis
        run: SOLC_BINARY="$RUNNER_TEMP/solc-linux-amd64-v0.8.30+commit.73712a01" pnpm security:slither
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - run: pnpm build:demo
      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
        run: |
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Installing Playwright Chromium (attempt $attempt/$max_attempts)"
            if timeout --kill-after=30s 5m pnpm exec playwright install --with-deps chromium; then
              exit 0
            else
              status=$?
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Playwright Chromium installation failed after $max_attempts attempts." >&2
              exit "$status"
            fi

            backoff_seconds=$((attempt * 10))
            echo "Playwright Chromium installation failed; retrying in ${backoff_seconds}s." >&2
            sleep "$backoff_seconds"
          done
      - name: Run WalletAccess browser E2E
        run: pnpm test:e2e:wallet
      - name: Upload WalletAccess E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-access-playwright-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: docker build -t civilization-dapp-test:ci .
      - name: Migration CLI fails safely without database configuration
        run: |
          set +e
          output="$(docker run --rm --entrypoint node civilization-dapp-test:ci scripts/db-migrate.mjs 2>&1)"
          status=$?
          set -e
          test "$status" -eq 1
          test "$output" = "Database migration failed (database_unavailable). No application process was started."

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select explicit release tags
        id: tags
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "release=latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "release=dev" >> "$GITHUB_OUTPUT"
          else
            echo "ref is not a release branch" >&2
            exit 1
          fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ralphschuler/civilization.dapp:${{ steps.tags.outputs.release }}
            ghcr.io/ralphschuler/civilization.dapp:${{ github.ref_name }}-${{ github.sha }}
