name: Verify and publish Civilization DApp container

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: civilization_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d civilization_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/civilization_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - run: pnpm build:demo
      - run: docker build -t civilization-dapp-test:ci .
      - name: Migration CLI fails safely without database configuration
        run: |
          set +e
          output="$(docker run --rm --entrypoint node civilization-dapp-test:ci scripts/db-migrate.mjs 2>&1)"
          status=$?
          set -e
          test "$status" -eq 1
          test "$output" = "Database migration failed (database_unavailable). No application process was started."

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select explicit release tags
        id: tags
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "release=latest" >> "$GITHUB_OUTPUT"
          else
            echo "release=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ralphschuler/civilization.dapp:${{ steps.tags.outputs.release }}
            ghcr.io/ralphschuler/civilization.dapp:${{ github.ref_name }}-${{ github.sha }}
