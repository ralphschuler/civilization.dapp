# TrueNAS Apps custom YAML for the `civilization.dapp` application.
# Replace every REPLACE_* value only in protected TrueNAS configuration.
services:
  civilization-migrate:
    image: ghcr.io/ralphschuler/civilization.dapp:latest
    command: ["node", "scripts/db-migrate.mjs"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: civilization
      PGUSER: civilization
      PGPASSWORD: REPLACE_POSTGRES_PASSWORD
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  civilization-dapp:
    image: ghcr.io/ralphschuler/civilization.dapp:latest
    environment:
      NODE_ENV: production
      CIVILIZATION_ENV: production
      WALLET_AUTH_URL: https://civilization.nyphon.de
      # Generate once with 32+ random characters. The ingress must overwrite
      # X-Forwarded-For and append one trusted proxy address.
      WALLET_AUTH_RATE_LIMIT_SECRET: REPLACE_32_PLUS_CHAR_RANDOM_SECRET
      WALLET_AUTH_TRUSTED_PROXY_HOPS: "1"
      WORLD_APP_ID: app_replace_with_mini_app_id
      CIVILIZATION_CONTRACT_ADDRESS: "0x99976f2f170F17a14ae6c69cEb8Cb31d47366764"
      CIVILIZATION_CHAIN_ID: "480"
      CIVILIZATION_WORLD_TOKEN_ADDRESS: "0x2cFc85d8E48F8EAB294be644d9E25C3030863003"
      # Protected HTTPS RPC URL used only for the read-only runtime check.
      CIVILIZATION_WORLDCHAIN_RPC_URL: REPLACE_PROTECTED_WORLDCHAIN_RPC_URL
      # Reviewed V2 address/runtime hash. Production readiness and delivery
      # stay closed until these replace the V1 placeholder with exact values.
      CIVILIZATION_WORLDCHAIN_V2_IMPLEMENTATION_ADDRESS: REPLACE_REVIEWED_V2_IMPLEMENTATION_ADDRESS
      CIVILIZATION_WORLDCHAIN_V2_IMPLEMENTATION_CODEHASH: REPLACE_REVIEWED_V2_IMPLEMENTATION_CODEHASH
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: civilization
      PGUSER: civilization
      PGPASSWORD: REPLACE_POSTGRES_PASSWORD
    ports:
      - "31057:31057"
    depends_on:
      civilization-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: civilization
      POSTGRES_USER: civilization
      POSTGRES_PASSWORD: REPLACE_POSTGRES_PASSWORD
    volumes:
      - civilization_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U civilization -d civilization",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  civilization_postgres:
