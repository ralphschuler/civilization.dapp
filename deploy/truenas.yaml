# TrueNAS Apps → Discover → ⋮ → Install via YAML.
# Replace secret placeholders only in TrueNAS secret editor. `WORLD_ID_RP_SIGNING_KEY`
# must never enter Git, browser builds, logs, or GitHub Actions. The service has
# no custody, purchase, sale, or mint endpoint; IMG/WLD is quote-only.
services:
  idlemint:
    image: ghcr.io/ralphschuler/civilization.dapp:latest
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "31057"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: idlemint
      PGUSER: idlemint
      PGPASSWORD: REPLACE_POSTGRES_PASSWORD
      WORLD_ID_RP_ID: rp_replace_after_portal_setup
      WORLD_ID_ACTION: play
      WORLD_ID_RP_SIGNING_KEY: REPLACE_WORLD_ID_RP_SIGNING_KEY
      WORLD_ID_RP_CONTEXT_TTL_SECONDS: "300"
    ports:
      - "31057:31057"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: idlemint
      POSTGRES_USER: idlemint
      POSTGRES_PASSWORD: REPLACE_POSTGRES_PASSWORD
    volumes:
      - idlemint_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idlemint -d idlemint"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  idlemint_postgres:
