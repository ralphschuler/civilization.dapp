# TrueNAS Apps custom YAML for the `civilization.dapp` application.
# Replace every REPLACE_* value only in protected TrueNAS configuration.
services:
  civilization-dapp:
    image: ghcr.io/ralphschuler/civilization.dapp:latest
    environment:
      NODE_ENV: production
      AUTH_URL: https://civilization.nyphon.de
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: REPLACE_RANDOM_AUTH_SECRET
      HMAC_SECRET_KEY: REPLACE_RANDOM_WALLET_NONCE_HMAC_SECRET
      RP_ID: rp_a84548cb908798cf
      RP_SIGNING_KEY: REPLACE_WORLD_DEVELOPER_PORTAL_RP_SIGNING_KEY
      WORLD_APP_ID: app_replace_with_mini_app_id
      WORLD_ID_APP_ID: app_replace_with_world_id_app_id
      WORLD_ID_ACTION: play
      WORLD_ID_PROOF_CONTEXT_URL: https://civilization.nyphon.de/api/rp-signature
      WORLD_ID_ENVIRONMENT: production
      CIVILIZATION_CONTRACT_ADDRESS: "0x1A64F89881FD2E38255E62c6D62b68076052DF4b"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: civilization
      PGUSER: civilization
      PGPASSWORD: REPLACE_POSTGRES_PASSWORD
    ports:
      - "31057:31057"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: civilization
      POSTGRES_USER: civilization
      POSTGRES_PASSWORD: REPLACE_POSTGRES_PASSWORD
    volumes:
      - civilization_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civilization -d civilization"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  civilization_postgres:
