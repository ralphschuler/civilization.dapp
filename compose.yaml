services:
  idlemint:
    build: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 31057
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: idlemint
      PGUSER: idlemint
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      WORLD_ID_RP_ID: ${WORLD_ID_RP_ID:?set WORLD_ID_RP_ID}
      WORLD_ID_ACTION: ${WORLD_ID_ACTION:-play}
      WORLD_ID_RP_SIGNING_KEY: ${WORLD_ID_RP_SIGNING_KEY:?set WORLD_ID_RP_SIGNING_KEY}
      WORLD_ID_RP_CONTEXT_TTL_SECONDS: ${WORLD_ID_RP_CONTEXT_TTL_SECONDS:-300}
    ports:
      - "127.0.0.1:31057:31057"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: idlemint
      POSTGRES_USER: idlemint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - idlemint_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idlemint -d idlemint"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  idlemint_postgres:
