services:
  civilization-migrate:
    build:
      context: .
    command: ["node", "scripts/db-migrate.mjs"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: civilization
      PGUSER: civilization
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  civilization-dapp:
    build:
      context: .
    environment:
      NODE_ENV: production
      CIVILIZATION_ENV: production
      WALLET_AUTH_URL: ${WALLET_AUTH_URL:-https://civilization.nyphon.de}
      WALLET_AUTH_RATE_LIMIT_SECRET: ${WALLET_AUTH_RATE_LIMIT_SECRET:?set WALLET_AUTH_RATE_LIMIT_SECRET}
      WALLET_AUTH_TRUSTED_PROXY_HOPS: ${WALLET_AUTH_TRUSTED_PROXY_HOPS:-1}
      WORLD_APP_ID: ${WORLD_APP_ID:?set WORLD_APP_ID}
      CIVILIZATION_CONTRACT_ADDRESS: ${CIVILIZATION_CONTRACT_ADDRESS:-0x0E6689d0649Ad9037465d178231b10F18518D2b0}
      CIVILIZATION_CHAIN_ID: "480"
      CIVILIZATION_WORLD_TOKEN_ADDRESS: ${CIVILIZATION_WORLD_TOKEN_ADDRESS:?set CIVILIZATION_WORLD_TOKEN_ADDRESS}
      CIVILIZATION_WORLDCHAIN_RPC_URL: ${CIVILIZATION_WORLDCHAIN_RPC_URL:?set CIVILIZATION_WORLDCHAIN_RPC_URL}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: civilization
      PGUSER: civilization
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:31057:31057"
    depends_on:
      civilization-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: civilization
      POSTGRES_USER: civilization
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - civilization_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U civilization -d civilization",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  civilization_postgres:
